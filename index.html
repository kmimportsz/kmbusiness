<script>
const KEY="agenda_vendas_v1";
let S={products:[],sales:[]},tab="home",filter="";
let insightsPeriod="day",insightsOffset=0,saleFilter="all",saleDateFilter="",stockSmart="default",financeOffset=0,receiptSearch="";
let kmPanel="executive",kmSpan="month",kmSpanOffset=0,kmStockMode="value",kmSearch="",kmCustomerQuery="",kmCritical=1,kmCompact=false,kmCatalogCompact=false,kmDateFrom="",kmDateTo="",kmMinPrice="",kmMaxPrice="",kmCalendarMode="due";
let dashboardChartDays=7;
let stockSort="default",catalogSort="default"; // Preferências apenas visuais, nunca sincronizadas
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
for(const k of["expenses","closings","config","proofs","catalog","cphotos"])if(!Array.isArray(S[k]))S[k]=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudSave()};
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const iso=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const today=()=>iso(new Date());
const fmt=s=>s.split("-").reverse().slice(0,2).join("/");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const addDate=(s,i,mode)=>{const d=new Date(s+"T12:00:00");if(mode==="w")d.setDate(d.getDate()+7*i);else if(mode==="q")d.setDate(d.getDate()+15*i);else{const dd=d.getDate();d.setMonth(d.getMonth()+i);if(d.getDate()!==dd)d.setDate(0)}return iso(d)};
const paid=s=>s.inst.filter(i=>i.paid).reduce((a,i)=>a+i.v,0);
const saleSettled=s=>window.kmNexus?.managed(s)
  ? paid(s)>0&&Math.round(paid(s)*100)>=Math.round(s.price*100)
  : (s.inst||[]).length>0&&s.inst.every(i=>i.paid);
const status=i=>i.paid?"ok":i.d<today()?"bad":i.d===today()?"warn":"";

function stats(){
  let sold=0,cost=0,rec=0,open=0,late=0;
  S.sales.forEach(s=>{sold+=s.price;cost+=s.cost;const p=paid(s);rec+=p;open+=s.price-p;s.inst.forEach(i=>{if(!i.paid&&i.d<today())late+=i.v})});
  return{sold,cost,rec,open,late,profit:sold-cost,real:rec-cost};
}
function allInst(){const a=[];S.sales.forEach(s=>s.inst.forEach((i,n)=>a.push({s,i,n})));return a}

function render(){
  $("nav").innerHTML=`<div class="topline"><div class="brandmark"><b>K&M BUSINESS</b><small>${({home:"PAINEL",cobr:"COBRANÇAS",sales:"VENDAS",orders:"PEDIDOS",prod:"ESTOQUE",more:"FERRAMENTAS",ops:"OPERAÇÕES",command:"INTELIGÊNCIA",calendar:"AGENDA",receipts:"RECIBOS",insights:"INDICADORES",km:"FINANCEIRO"})[tab]||"GESTÃO"}</small></div><button class="menu-open" aria-label="Abrir menu" aria-expanded="false" onclick="toggleMenu(true)">☰</button></div>`;
  $("fab").style.display=(tab==="prod"||tab==="more"||["km","insights","calendar","receipts","command","ops","catalog","orders"].includes(tab))?"none":"block";
  if(tryClose())save();
  $("app").innerHTML={home,cobr,sales,prod,more,km,insights,calendarFinance,receipts,command:kmCommand,ops:operationCenter,catalog:publicCatalogPanel,orders:()=>window.kmNexus.ordersView()}[tab]();
}
const go=t=>{toggleMenu(false);tab=t;render();scrollTo(0,0)};
function toggleMenu(open){const layer=$("menuOverlay"),drawer=$("menuDrawer");if(!layer||!drawer)return;layer.classList.toggle("open",!!open);document.body.style.overflow=open?"hidden":"";if(!open)return;
const items=[["home","◈","Início"],["sales","▤","Vendas"],["orders","▦","Pedidos"],["cobr","◷","Cobranças"],["prod","▣","Estoque"],["catalog","▦","Catálogo"],["ops","⚡","Central de operações"],["command","◆","Visão estratégica"],["insights","▥","Indicadores por período"],["calendar","▦","Calendário financeiro"],["receipts","🧾","Recibos"],["km","📊","Inteligência financeira"],["more","⚙","Mais / Configurações"]];
drawer.innerHTML=`<div class="drawer-title"><div><b>K&M IMPORTS</b><div class="sub">Seu espaço de trabalho</div></div><button class="g" onclick="toggleMenu(false)" aria-label="Fechar menu">✕</button></div>`+items.map(([k,ic,txt])=>`<button class="drawer-link ${tab===k?"on":""}" onclick="go('${k}')"><span>${ic}</span>${txt}</button>`).join("");}
document.addEventListener("keydown",e=>{if(e.key==="Escape")toggleMenu(false)});

/* Gráfico local do dashboard. Somente leitura de S.sales. */
function dashboardSalesChart(){
  const days=dashboardChartDays===30?30:7;
  const now=today();
  const points=Array.from({length:days},(_,i)=>{
    const date=addDays(now,i-days+1);
    return {date,label:date.slice(8)+"/"+date.slice(5,7),value:S.sales.reduce((sum,s)=>sum+(s.date===date?Number(s.price)||0:0),0)};
  });
  const maximum=Math.max(1,...points.map(x=>x.value));
  const total=points.reduce((sum,x)=>sum+x.value,0);
  const W=640,H=168,left=12,right=12,top=14,bottom=23;
  const plotW=W-left-right,plotH=H-top-bottom;
  const coords=points.map((p,i)=>({x:left+(days===1?plotW/2:i*plotW/(days-1)),y:top+plotH*(1-p.value/maximum)}));
  const line=coords.map((p,i)=>(i?'L':'M')+p.x.toFixed(2)+' '+p.y.toFixed(2)).join(' ');
  const area=line+' L '+coords.at(-1).x.toFixed(2)+' '+(H-bottom)+' L '+coords[0].x.toFixed(2)+' '+(H-bottom)+' Z';
  const labels=[0,Math.floor((days-1)/2),days-1].filter((x,i,a)=>a.indexOf(x)===i);
  return `<section class="dashboard-chart" aria-label="Gráfico de faturamento dos últimos ${days} dias">
    <div class="dashboard-chart-head"><div><span class="eyebrow-chart">DESEMPENHO COMERCIAL</span><h2>Faturamento diário</h2><strong>${money(total)}</strong><small> em ${days} dias</small></div><div class="chart-controls"><button class="${days===7?'on':''}" onclick="dashboardChartDays=7;render()">7 dias</button><button class="${days===30?'on':''}" onclick="dashboardChartDays=30;render()">30 dias</button></div></div>
    <svg class="revenue-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Linha mostrando o faturamento de ${days} dias" preserveAspectRatio="none">
      <defs><linearGradient id="revenueLine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#24486c"/><stop offset="1" stop-color="#568bc0"/></linearGradient><linearGradient id="revenueArea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#23476d" stop-opacity=".35"/><stop offset="1" stop-color="#23476d" stop-opacity="0"/></linearGradient></defs>
      <path d="M ${left} ${top+plotH/2} L ${W-right} ${top+plotH/2} M ${left} ${top+plotH} L ${W-right} ${top+plotH}" stroke="#23303d" stroke-dasharray="4 7" fill="none"/>
      <path d="${area}" fill="url(#revenueArea)"/><path d="${line}" fill="none" stroke="url(#revenueLine)" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
      ${days===7?coords.map((c,i)=>`<circle cx="${c.x}" cy="${c.y}" r="4" fill="#4b80b4" stroke="#080a0d" stroke-width="2"><title>${points[i].label}: ${money(points[i].value)}</title></circle>`).join(''):''}
      ${labels.map(i=>`<text x="${coords[i].x}" y="${H-4}" font-size="12" text-anchor="${i===0?'start':i===days-1?'end':'middle'}" fill="#9daabd">${points[i].label}</text>`).join('')}
    </svg><div class="chart-foot">Valores calculados pelas datas das vendas registradas. Não representa necessariamente pagamentos recebidos.</div>
  </section>`;
}

function home(){
  const t=stats(),all=allInst().filter(x=>!x.i.paid).sort((a,b)=>a.i.d.localeCompare(b.i.d));
  const hoje=all.filter(x=>x.i.d===today()),atr=all.filter(x=>x.i.d<today());
  const m=today().slice(0,7);
  const mesRec=allInst().filter(x=>x.i.paid&&(x.i.pd||x.i.d).slice(0,7)===m).reduce((a,x)=>a+x.i.v,0);
  const mesVend=S.sales.filter(s=>s.date.slice(0,7)===m).length;
  const top={};S.sales.forEach(s=>{top[s.name]=(top[s.name]||0)+1});
  const best=Object.entries(top).sort((a,b)=>b[1]-a[1])[0];
  const low=S.products.filter(p=>(+p.stock||0)<=1).sort((a,b)=>(a.stock-b.stock)||byName(a,b));
  const gr={};S.sales.forEach(s=>{const p=S.products.find(x=>x.id===s.pid),k=rk==="mod"&&p&&p.brand&&p.model?p.brand+" "+p.model:s.name;(gr[k]=gr[k]||{n:0,l:0}).n++;gr[k].l+=s.price-s.cost});
  const rank=Object.entries(gr).sort((a,b)=>b[1].n-a[1].n||b[1].l-a[1].l).slice(0,6);
  return`<header class="km-head"><span class="km-badge">K&M / SEU NEGÓCIO</span><h1>Mais clareza.<br>Mais tempo para cuidar.</h1><p>Seu dia de trabalho começa aqui. Confira os números e escolha o próximo passo.</p></header><section class="service-launch" aria-label="Cuidado com o cliente"><div><span class="eyebrow">RELACIONAMENTO</span><h2>Cada cliente, uma boa experiência.</h2><p>Organize um pedido, ouça quem comprou ou acompanhe o atendimento.</p></div><div class="service-actions"><a href="https://kmimportsz.github.io/formularioatendimento/" target="_blank" rel="noopener noreferrer">Preparar pedido ↗</a><a href="https://kmimportsz.github.io/formularioavaliacao/" target="_blank" rel="noopener noreferrer">Pedir avaliação ↗</a><a href="https://kmimportsz.github.io/kmdiretoria/" target="_blank" rel="noopener noreferrer">Central da equipe ↗</a></div></section><h2>Visão do negócio</h2>
  <div class="grid">
   <div class="card"><div class="k">Total vendido</div><div class="v">${money(t.sold)}</div></div>
   <div class="card"><div class="k">Quanto paguei (custo)</div><div class="v">${money(t.cost)}</div></div>
   <div class="card"><div class="k">Lucro previsto</div><div class="v ${t.profit>=0?"ok":"bad"}">${money(t.profit)}</div></div>
   <div class="card"><div class="k">Lucro real (recebido − custo)</div><div class="v ${t.real>=0?"ok":"bad"}">${money(t.real)}</div></div>
   <div class="card"><div class="k">Já recebi</div><div class="v ok">${money(t.rec)}</div></div>
   <div class="card"><div class="k">A receber</div><div class="v warn">${money(t.open)}</div></div>
  </div>
  ${dashboardSalesChart()}
  ${t.late>0?`<div class="card item" style="margin-top:10px;border-color:var(--bad)"><b class="bad">⚠️ ${money(t.late)} em atraso</b><div class="sub">${atr.length} parcela(s) vencida(s)</div></div>`:""}
  <button class="quick" onclick="go('ops')" style="width:100%;margin:14px 0"><b>⚡ Central de operações</b><small>Ações rápidas, cobrança, metas e reposição</small></button>
  <button class="quick" onclick="go('insights')" style="width:100%;margin:14px 0"><b>◈ K&M Insights</b><small>Resumo diário, semanal, quinzenal e mensal · Comparativo de vendas</small></button>
  ${kmCard()}
  <h2>Hoje (${hoje.length})</h2>${hoje.length?hoje.map(instRow).join(""):`<div class="empty">Nada vence hoje 🎉</div>`}
  <h2>Atrasadas (${atr.length})</h2>${atr.length?atr.slice(0,5).map(instRow).join(""):`<div class="empty">Nenhuma atrasada</div>`}
  ${S.products.length?`<h2>Estoque baixo (${low.length})</h2>${low.length?low.slice(0,8).map(p=>`<div class="card item"><div class="row"><b class="grow">${esc(p.name)}</b><b class="${p.stock<=0?"bad":"warn"}">${p.stock<=0?"Sem estoque":"Resta "+p.stock}</b></div></div>`).join("")+(low.length>8?`<div class="sub">+ ${low.length-8} na aba Pods</div>`:""):`<div class="empty">Estoque em dia 👍</div>`}`:""}
  <h2>Mais vendidos</h2><div class="row" style="margin-bottom:8px"><button class="${rk==="pod"?"":"g"}" onclick="rk='pod';render()">Por sabor</button><button class="${rk==="mod"?"":"g"}" onclick="rk='mod';render()">Por modelo</button></div>
  ${rank.length?rank.map(([k,v])=>`<div class="card item"><div class="row"><b class="grow">${esc(k)}</b><span class="sub">${v.n} venda${v.n>1?"s":""} · lucro <b class="${v.l>=0?"ok":"bad"}">${money(v.l)}</b></span></div></div>`).join(""):`<div class="empty">Ainda sem vendas.</div>`}
  <h2>Este mês</h2><div class="card"><div class="sub">Vendas feitas: <b>${mesVend}</b> · Recebido: <b class="ok">${money(mesRec)}</b>${best?` · Mais vendido: <b>${esc(best[0])}</b> (${best[1]})`:""}</div></div>`;
}
function instRow(x){
  const {s,i,n}=x,st=status(i),dias=Math.round((new Date(i.d)-new Date(today()))/864e5);
  const lbl=i.paid?"Pago":st==="bad"?`${-dias}d atraso`:st==="warn"?"Hoje":`em ${dias}d`;
  const msg=encodeURIComponent(`Oi ${s.client}! Passando para lembrar da parcela ${n+1}/${s.inst.length} (${money(i.v)}) do ${s.name}, vencimento ${fmt(i.d)}. Obrigado!`);
  const ph=(s.phone||"").replace(/\D/g,"");
  return`<div class="card item"><div class="row">${thumb(s)}<div class="grow"><b>${esc(s.client||"Sem nome")}</b> <span class="chip ${st}">${lbl}</span>
  <div class="sub">${esc(s.name)} · parcela ${n+1}/${s.inst.length} · ${fmt(i.d)}</div><div><b>${money(i.v)}</b></div></div>
  <div style="display:grid;gap:6px">${i.paid?"":`<button onclick="pay('${s.id}',${n})">✓ Pago</button>`}${ph&&!i.paid?`<a class="btn g" target="_blank" rel="noopener" href="https://wa.me/55${ph}?text=${msg}">💬 Cobrar</a>`:""}${i.paid?"":`<a class="btn g" target="_blank" rel="noopener" href="${gcal(s,i,n)}">📅 Agenda</a>`}${i.paid?`<button class="g" onclick="proofForm('${s.id}',${n})">${getProof(s.id,n)?"🧾 Ver":"＋ 🧾"}</button>`:""}</div></div></div>`;
}
const gcal=(s,i,n)=>{const d=new Date(i.d+"T12:00:00");d.setDate(d.getDate()+1);return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("💰 Receber "+money(i.v)+" - "+(s.client||"cliente"))+"&dates="+i.d.replace(/-/g,"")+"/"+iso(d).replace(/-/g,"")+"&details="+encodeURIComponent(s.name+" · parcela "+(n+1)+"/"+s.inst.length)};
const thumb=s=>s.img?`<img class="thumb" src="${s.img}" alt="">`:`<div class="thumb">💨</div>`;

function cobr(){
  const f=filter,list=allInst().filter(x=>f==="paid"?x.i.paid:f==="late"?(!x.i.paid&&x.i.d<today()):!x.i.paid).sort((a,b)=>a.i.d.localeCompare(b.i.d));
  const commercial=(S.sales||[]).filter(s=>window.kmNexus?.managed(s));
  return`<h1>Cobranças</h1>${commercial.length?`<details class="card"><summary>Cadastrar cobrança manual</summary>${commercial.map(s=>`<div class="inst"><span>${esc(s.client||"Sem nome")} · ${esc(s.orderCode||s.name)}</span>${window.kmNexus.button('charge',s.id,'Cadastrar cobrança')}</div>`).join('')}</details>`:''}<div class="row" style="margin-bottom:10px">
  ${[["","A receber"],["late","Atrasadas"],["paid","Pagas"]].map(([k,t])=>`<button class="${f===k?"":"g"}" onclick="filter='${k}';render()">${t}</button>`).join("")}</div>
  ${list.length?list.map(x=>instRow(x)+(window.kmNexus?.managed(x.s)&&!x.i.paid?`<button type="button" class="g" data-nexus-action="charge" data-nexus-id="${esc(x.s.id)}" data-nexus-index="${x.n}">Editar cobrança</button>`: '')).join(""):`<div class="empty">Nada por aqui</div>`}`;
}
let tmpProof="";
const getProof=(id,n)=>((S.proofs.find(x=>x.id===id+"_"+n))||{}).img||"";
function setProof(id,n,img){const k=id+"_"+n,j=S.proofs.findIndex(x=>x.id===k);if(!img){if(j>=0)S.proofs.splice(j,1)}else if(j>=0)S.proofs[j].img=img;else S.proofs.push({id:k,img})}
function pay(id,n){const s=S.sales.find(x=>x.id===id),i=s.inst[n];
  if(i.paid){i.paid=false;i.pd=null;save();render();return}
  tmpProof="";modal(`<h1>Marcar como pago</h1><div class="sub">${esc(s.client||"Sem nome")} · ${esc(s.name)} · parcela ${n+1}/${s.inst.length} · <b>${money(i.v)}</b></div>
  <label>Comprovante (foto, opcional)</label><div class="row"><img id="prv" class="thumb" style="width:72px;height:72px"><div class="grow"><input type="file" accept="image/*" onchange="readImg(this,d=>{tmpProof=d;prv.src=d},1000,.6)"></div></div>
  <div class="row" style="margin-top:14px"><button onclick="confirmPay('${id}',${n})">✓ Confirmar pagamento</button><button class="g" onclick="closeM()">Cancelar</button></div>`)}
function confirmPay(id,n){const i=S.sales.find(x=>x.id===id).inst[n];i.paid=true;i.pd=today();if(tmpProof)setProof(id,n,tmpProof);save();closeM();render()}
function proofForm(id,n){const im=getProof(id,n);modal(`<h1>🧾 Comprovante</h1>${im?`<img src="${im}" style="width:100%;border-radius:12px;margin:8px 0">`:`<div class="empty">Sem comprovante ainda.</div>`}
  <label>${im?"Trocar foto":"Adicionar foto"}</label><input type="file" accept="image/*" onchange="readImg(this,d=>{setProof('${id}',${n},d);save();closeM();render()},1000,.6)">
  <div class="row" style="margin-top:12px">${im?`<button class="r" onclick="setProof('${id}',${n},'');save();closeM();render()">Remover</button>`:""}<button class="g" onclick="closeM()">Fechar</button></div>`)}

function sales(){
  const q=norm(filter||"");
  const list=[...S.sales].filter(s=>{
    if(window.b3SelectedOwner&&s.owner!==window.b3SelectedOwner)return false;
    const searchable=norm([s.client,s.name,s.phone,s.price,s.cost,s.note,s.date].join(" "));
    const done=saleSettled(s);
    const partial=!done&&(s.inst||[]).some(i=>i.paid);
    return (!q||searchable.includes(q))&&(!saleDateFilter||s.date===saleDateFilter)&&(!kmDateFrom||s.date>=kmDateFrom)&&(!kmDateTo||s.date<=kmDateTo)&&(!kmMinPrice||+s.price>=+kmMinPrice)&&(!kmMaxPrice||+s.price<=+kmMaxPrice)&&
      (saleFilter==="all"||(saleFilter==="done"&&done)||(saleFilter==="open"&&!done)||(saleFilter==="partial"&&partial));
  });
  const groups=new Map();
  list.forEach(s=>{const d=s.date||"Sem data";if(!groups.has(d))groups.set(d,[]);groups.get(d).push(s)});
  const dates=[...groups.keys()].sort((a,b)=>b.localeCompare(a));
  const row=s=>{
    const p=paid(s),pct=s.price?Math.min(100,p/s.price*100):0;
    const done=saleSettled(s);
    return`<details class="card item ${done?"sale-closed":""}"><summary style="list-style:none;cursor:pointer"><div class="row">${thumb(s)}<div class="grow"><div class="row" style="justify-content:space-between;align-items:flex-start;gap:5px"><b>${esc(s.client||"Sem nome")}</b><span class="sale-status ${done?"done":""}">${done?"✓ Pago":p>0?"◷ Parcial":"◷ Pendente"}</span></div>
    <div class="sub">${esc(s.name)} · ${fmt(s.date)} · ${s.source==="catalog"?"Catálogo":"Manual"}</div>
    <div class="sub">Venda <b>${money(s.price)}</b> · Lucro ${money(s.price-s.cost)}</div></div></div>
    <div class="bar"><i style="width:${pct}%"></i></div><div class="sub">Recebido ${money(p)} de ${money(s.price)}</div></summary>
    ${s.inst.map((i,n)=>`<div class="inst"><span>${n+1}ª · ${fmt(i.d)} · ${money(i.v)} <span class="chip ${status(i)}">${i.paid?"pago":status(i)==="bad"?"atrasada":"aberta"}</span></span><span class="row" style="gap:6px">${i.paid?`<button class="g" onclick="proofForm('${s.id}',${n})">${getProof(s.id,n)?"🧾":"＋🧾"}</button>`:""}${i.paid&&window.kmNexus?.managed(s)?'':`<button class="${i.paid?"g":""}" onclick="pay('${s.id}',${n})">${i.paid?"Desfazer":"Pago"}</button>`}</span></div>`).join("")}
    ${s.note?`<div class="sub" style="margin-top:6px">📝 ${esc(s.note)}</div>`:""}
    ${window.kmNexus?.managed(s)?`<div class="row">${window.kmNexus.button('edit',s.id,'Editar venda')}${window.kmNexus.button('charge',s.id,'Cadastrar cobrança')}<button class="g" onclick="printReceipt('${s.id}')">Recibo</button></div>`:`<div class="row" style="justify-content:flex-end;flex-wrap:wrap;margin-top:8px"><button onclick="printReceipt('${s.id}')">🧾 Recibo</button><button class="g" onclick="saleForm('${s.id}')">✏️ Editar venda</button><button class="r" onclick="delSale('${s.id}')">Excluir venda</button></div>`}</details>`;
  };
  return`<h1>Vendas</h1><input id="salesSearch" placeholder="🔍 Buscar cliente, produto, telefone, valor ou data" value="${esc(filter)}" oninput="filter=this.value;render();const el=$('salesSearch');el.focus();el.setSelectionRange(el.value.length,el.value.length)">
  <div class="toolbar-filters"><select aria-label="Filtrar situação da venda" onchange="saleFilter=this.value;render()"><option value="all" ${saleFilter==="all"?"selected":""}>Todas as situações</option><option value="open" ${saleFilter==="open"?"selected":""}>Pendentes + parciais</option><option value="partial" ${saleFilter==="partial"?"selected":""}>Pagamento parcial</option><option value="done" ${saleFilter==="done"?"selected":""}>Totalmente pagas</option></select>
  <input type="date" aria-label="Filtrar data da venda" value="${saleDateFilter}" onchange="saleDateFilter=this.value;render()"></div>
  <details class="km-report"><summary style="cursor:pointer;font-weight:600">⚙️ Filtros avançados: período e valor</summary><div class="km-selector"><div><label>De</label><input type="date" value="${kmDateFrom}" onchange="kmDateFrom=this.value;render()"></div><div><label>Até</label><input type="date" value="${kmDateTo}" onchange="kmDateTo=this.value;render()"></div><div><label>Valor mínimo</label><input type="number" value="${kmMinPrice}" onchange="kmMinPrice=this.value;render()" placeholder="R$"></div><div><label>Valor máximo</label><input type="number" value="${kmMaxPrice}" onchange="kmMaxPrice=this.value;render()" placeholder="R$"></div></div><button class="g" style="margin-top:9px" onclick="kmDateFrom='';kmDateTo='';kmMinPrice='';kmMaxPrice='';saleDateFilter='';saleFilter='all';render()">Limpar filtros avançados</button></details><div class="mini-meta">${list.length} venda(s) encontrada(s) ${saleDateFilter?` · <a href="#" onclick="saleDateFilter='';render();return false">Limpar data</a>`:""}</div>
  ${dates.length?dates.map(d=>{const day=groups.get(d);day.sort((a,b)=>{

const PROOF_FROM="2026-11-04",EXC=["Frete / entrega","Embalagem","Anúncios / marketing","Taxas (Pix, maquininha)","Equipamento","Outros"];
const pad=n=>String(n).padStart(2,"0"),dim=(y,m)=>new Date(y,m,0).getDate(),c30=(y,m)=>Math.min(30,dim(y,m));
const addDays=(d,n)=>{const x=new Date(d+"T12:00:00");x.setDate(x.getDate()+n);return iso(x)};
const cyStart=d=>{const[y,m,dd]=d.split("-").map(Number);if(dd>=c30(y,m))return y+"-"+pad(m)+"-"+pad(c30(y,m));let py=y,pm=m-1;if(pm<1){pm=12;py--}return py+"-"+pad(pm)+"-"+pad(c30(py,pm))};
const nextStart=st=>{let[y,m]=st.split("-").map(Number);m++;if(m>12){m=1;y++}return y+"-"+pad(m)+"-"+pad(c30(y,m))};
const cyEnd=st=>addDays(nextStart(st),-1),prevStart=st=>cyStart(addDays(st,-1));
const sumBy=(L,f)=>L.reduce((a,x)=>a+f(x),0);
const metas=()=>S.config.find(x=>x.id==="metas")||{lucro:0,vendas:0};
const sBrand=s=>{const p=S.products.find(x=>x.id===s.pid);if(p&&p.brand)return p.brand;const b=CATS().find(c=>(s.name||"").startsWith(c.name+" "));return b?b.name:"Sem marca"};
function cyCalc(from,to){
  const sl=S.sales.filter(s=>s.date>=from&&s.date<=to),ex=S.expenses.filter(x=>x.date>=from&&x.date<=to);
  const sold=sumBy(sl,s=>s.price),cost=sumBy(sl,s=>s.cost),exp=sumBy(ex,x=>x.v);let rec=0;
  allInst().forEach(({i})=>{if(i.paid){const d=i.pd||i.d;if(d>=from&&d<=to)rec+=i.v}});
  const open=sumBy(sl,s=>sumBy(s.inst.filter(i=>!i.paid),i=>i.v)),bb={},ec={},tp={};
  sl.forEach(s=>{const b=sBrand(s);(bb[b]=bb[b]||{b,n:0,sold:0,cost:0}).n++;bb[b].sold+=s.price;bb[b].cost+=s.cost;(tp[s.name]=tp[s.name]||{name:s.name,n:0,l:0}).n++;tp[s.name].l+=s.price-s.cost});
  ex.forEach(x=>{ec[x.cat]=(ec[x.cat]||0)+x.v});
  return{from,to,n:sl.length,sold,cost,exp,profit:sold-cost-exp,rec,open,byBrand:Object.values(bb).sort((a,b)=>b.cost-a.cost),exByCat:Object.entries(ec).map(([c,v])=>({c,v})).sort((a,b)=>b.v-a.v),top:Object.values(tp).sort((a,b)=>b.n-a.n||b.l-a.l).slice(0,5)}}
function tryClose(){

  const cur=cyStart(today());let st=cyStart(ds[0]),ch=false;

  return ch}

const dateObj=d=>new Date(d+"T12:00:00");
const dateHuman=d=>{if(!d)return"Sem data";const [y,m,dd]=d.split("-");return `${dd}/${m}/${y}`};
const periodWindow=(type,off=0)=>{
  const now=today(),dt=dateObj(now),y=dt.getFullYear(),m=dt.getMonth(),day=dt.getDate();
  let start,end;
  if(type==="day"){start=addDays(now,off);end=start}
  else if(type==="week"){
    const monday=addDays(now,-((dt.getDay()+6)%7)+off*7);
    start=monday;end=addDays(monday,6);
  }else if(type==="fortnight"){
    const half=day<=15?0:1;
    const index=y*24+m*2+half+off,yy=Math.floor(index/24),mm=Math.floor((index%24+24)%24/2),hh=((index%2)+2)%2;
    start=iso(new Date(yy,mm,hh?16:1,12));end=iso(new Date(yy,mm,hh?new Date(yy,mm+1,0).getDate():15,12));
  }else{start=iso(new Date(y,m+off,1,12));end=iso(new Date(y,m+off+1,0,12))}
  return {start,end};
};
const sumList=(items,f)=>items.reduce((v,x)=>v+(Number(f(x))||0),0);

  const billed=sumList(sales,x=>x.price),cost=sumList(sales,x=>x.cost),outlay=sumList(expenses,x=>x.v),received=sumList(payEntries,({i})=>i.v);

    open:sales.reduce((a,s)=>a+sumList((s.inst||[]).filter(i=>!i.paid),i=>i.v),0),
    payments:payEntries.length};
}

const kmCsvCell=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
function kmExportCSV(which){
 let rows=[],name="";
 if(which==="sales"){name="vendas";rows=[["Data","Cliente","Telefone","Produto","Valor","Custo","Recebido","Pendente","Situacao"],...S.sales.map(s=>[s.date,s.client,s.phone,s.name,s.price,s.cost,kmPaid(s),kmNum(s.price)-kmPaid(s),kmSaleDone(s)?"Pago":"Pendente"])]}
 else if(which==="stock"){name="estoque";rows=[["Marca","Modelo","Produto","Quantidade","Custo unitario","Preco unitario"],...S.products.map(p=>[p.brand,p.model,p.name,p.stock,p.cost,p.price])]}
 else{name="clientes";rows=[["Cliente","Telefone","Compras","Total","Recebido"],...kmVisits().map(c=>[c.client,c.phone,c.sales.length,c.total,c.received])]}
 const csv='\ufeff'+rows.map(row=>row.map(kmCsvCell).join(';')).join('\r\n');
 const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download=`KM_${name}_${today()}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}

let opPane='today',opPeriod='day',opOffset=0,opPriceSearch='',opOrderLines=[],opStockNeed=2;
const opSum=(xs,fn)=>xs.reduce((n,x)=>n+(Number(fn(x))||0),0);
const opOpenInst=()=>allInst().filter(({i})=>!i.paid);
const opDue30=()=>opOpenInst().filter(({i})=>i.d>=today()&&i.d<=addDays(today(),30));
const opLate=()=>opOpenInst().filter(({i})=>i.d<today());
const opLabelDate=d=>d?dateHuman(d):'Sem data';
const opFormatPct=n=>(Number.isFinite(n)?n.toFixed(1):'0,0').replace('.',',')+'%';
const opInput=(id,label,value='',type='number',extra='')=>`<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${type==='number'?'inputmode="decimal" step="any"':''} ${extra}></div>`;
const opBox=(heading,body)=>`<section class="ops-box"><b>${heading}</b>${body}</section>`;
const opSummary=(label,value,hint='')=>`<div class="card"><div class="k">${label}</div><div class="v">${value}</div>${hint?`<div class="sub">${hint}</div>`:''}</div>`;
const opPeriodOpts={day:'Diário',week:'Semanal',fortnight:'Quinzenal',month:'Mensal'};
const opFiscal=(w)=>{
 const d=periodStats(w),paidNow=opSum(allInst().filter(({i})=>i.paid&&(i.pd||i.d)>=w.start&&(i.pd||i.d)<=w.end),({i})=>i.v);
 return {...d,paidNow};
};
const opTextReport=()=>{const w=periodWindow(opPeriod,opOffset),v=opFiscal(w);return `K&M IMPORTS | Resumo ${opPeriodOpts[opPeriod]}\nPeríodo: ${opLabelDate(w.start)} a ${opLabelDate(w.end)}\nVendas: ${v.n}\nFaturamento: ${money(v.billed)}\nRecebimentos no período: ${money(v.received)}\nCusto das vendas: ${money(v.cost)}\nDespesas lançadas: ${money(v.outlay)}\nResultado previsto do período: ${money(v.profit)}\nEm aberto nas vendas realizadas no período: ${money(v.open)}\n\nValores calculados com os registros atuais. Recebimento não equivale a lucro.`};

// Rules can report a revision collision as permission-denied before Firestore retries it.
async function runStockTransaction(action){
  for(let attempt=0;;attempt++){
    const revisions=new Map();
    try{
      return await db.runTransaction(tx=>{
        revisions.clear();
        return action({
          async get(ref){
            const snap=await tx.get(ref);
            if(ref.parent?.id==="products")revisions.set(ref,snap.exists?(snap.data().stockRevision??0):null);
            return snap;
          },
          set:(...args)=>tx.set(...args),update:(...args)=>tx.update(...args),delete:(...args)=>tx.delete(...args)
        });
      });
    }catch(error){
      if(error.code!=="permission-denied"||attempt>=2||!revisions.size)throw error;
      const changed=await db.runTransaction(async tx=>{
        const comparisons=await Promise.all([...revisions].map(async ([ref,version])=>{
          const snap=await tx.get(ref);
          return (snap.exists?(snap.data().stockRevision??0):null)!==version;
        }));
        return comparisons.some(Boolean);
      });
      if(!changed)throw error;
    }
  }
}
// Stock writes use the server version. Snapshot JSON is a comparison baseline, never a write payload.
const productRecord=(data,id)=>data?{...data,id}:null;
const productEqual=(a,b)=>{
  if(!a||!b)return a===b;
  return Object.keys(a).length===Object.keys(b).length&&Object.keys(a).every(k=>JSON.stringify(a[k])===JSON.stringify(b[k]));
};
function productWithStock(before,after){
  if((!before||before.stock!==after.stock)&&(!Number.isSafeInteger(after.stock)||after.stock<0))throw Error("Informe um estoque inteiro e não negativo.");
  return {...after,stockRevision:before&&before.stock===after.stock?(before.stockRevision??0):(before?.stockRevision??0)+1};
}
function applyProductState(id,record){
  const index=S.products.findIndex(p=>p.id===id);
  if(record&&index>=0)S.products[index]=record;
  else if(record)S.products.push(record);
  else if(index>=0)S.products.splice(index,1);
  if(record)last.products[id]=JSON.stringify(record);else delete last.products[id];
}
async function commitProductChanges(changes,{seed=false}={}){
  if(!changes.length)return;
  const hasDeletes=changes.some(change=>!change.after);
  if(changes.length+(hasDeletes?1:0)>500)throw Error("A operação excede o limite de gravações no estoque.");
  const result=await runStockTransaction(async tx=>{
    const rows=await Promise.all(changes.map(async change=>{
      const ref=db.collection("products").doc(change.id),snap=await tx.get(ref);
      return {...change,ref,live:productRecord(snap.exists?snap.data():null,change.id)};
    }));
    const deletions=[];
    const outcomes=rows.map(({ref,id,before,after,live})=>{
      if((seed&&live)||productEqual(live,after)||(after&&productEqual(live,productWithStock(before,after))))return {id,value:live};
      if(!productEqual(live,before))throw Error("O produto mudou em outra sessão. Reabra e confira o estoque.");
      if(after){const value=productWithStock(live,after);tx.set(ref,value);return {id,value}}
      deletions.push([id,live?.stockRevision??0]);
      tx.delete(ref);return {id,value:null};
    });
    if(deletions.length)tx.set(db.collection("config").doc("nexus-stock-deletion"),{
      id:"nexus-stock-deletion",actor:au.currentUser.uid,at:firebase.firestore.FieldValue.serverTimestamp(),
      revisions:Object.fromEntries(deletions)
    });
    return outcomes;
  });
  for(const {id,value} of result){
    const shown=S.products.find(p=>p.id===id)||null;
    const change=changes.find(x=>x.id===id);
    if(productEqual(shown,change.before)||productEqual(shown,change.after))applyProductState(id,value);
  }
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}
}
let productSyncPending=Promise.resolve();
function syncLegacyProducts(seed=false){
  if(!ready.products&&!seed)return;
  const current=new Map(S.products.map(p=>[p.id,JSON.parse(JSON.stringify(p))]));
  const ids=seed?[...current.keys()]:[...new Set([...current.keys(),...Object.keys(last.products)])];
  const changes=ids.map(id=>({id,before:seed?null:JSON.parse(last.products[id]||"null"),after:current.get(id)||null}))
    .filter(row=>!productEqual(row.before,row.after));
  if(!changes.length)return productSyncPending;
  const session=au?.currentUser?.uid;
  productSyncPending=productSyncPending.then(async()=>{
    if(!db||!cloudOn||session!==au?.currentUser?.uid)return;
    try{await commitProductChanges(changes,{seed})}catch(error){
      console.error(error);
      alert("Não foi possível sincronizar a alteração no estoque: "+error.message);
      // Refresh the local baseline after reverting only the conflicting optimistic edits.
      await Promise.all(changes.map(async ({id,before,after})=>{
        const shown=S.products.find(p=>p.id===id)||null;
        if(!productEqual(shown,after))return;
        const snap=await db.runTransaction(tx=>tx.get(db.collection("products").doc(id))).catch(()=>null);
        if(productEqual(S.products.find(p=>p.id===id)||null,after)){
          if(snap)applyProductState(id,productRecord(snap.exists?snap.data():null,id));
          else if(productEqual(JSON.parse(last.products[id]||"null"),before))applyProductState(id,before);
        }
      }));
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}
      if(!$("modal").innerHTML)render();
    }
  });
  return productSyncPending;
}

async function saveProductCloud(id){
  return submitProductOperation(async()=>{
    const cost=+$("pc").value||0,price=+$("pp").value||0,b=pBrand(),m=b?pModel():null;
    const operation=productFormOperation,img=tmpImg;
    if(b&&!id){
      if(!m)throw Error("Escolha o modelo");
      const flavors=Object.entries(pSel);
      if(!flavors.length)throw Error("Marque pelo menos um sabor");
      if(flavors.length>499)throw Error("Selecione até 499 sabores por operação.");
      const variants=await Promise.all(flavors.map(async ([flavor,qty])=>{
        if(!Number.isSafeInteger(qty)||qty<0)throw Error("Informe quantidades inteiras e não negativas.");
        const name=b.name+" "+m.n+" – "+flavor;
        const existing=S.products.find(p=>norm(p.name)===norm(name));
        const digest=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(norm(name)));
        const id=existing?.id||"variant-"+Array.from(new Uint8Array(digest),v=>v.toString(16).padStart(2,"0")).join("");
        return {id,name,brand:b.name,model:m.n,flavor,cost,price,stock:qty,img:img||cph(b.name,m.n,flavor),existing:!!existing};
      }));
      if(new Set(variants.map(v=>v.id)).size!==variants.length)throw Error("Confira os sabores repetidos.");
      const marker=db.collection("config").doc(operation);
      const fingerprint=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",
        new TextEncoder().encode(JSON.stringify(variants.map(({existing,id,...variant})=>variant))))),v=>v.toString(16).padStart(2,"0")).join("");
      const already=await runStockTransaction(async tx=>{
        const saved=await tx.get(marker);
        if(saved.exists){
          if(saved.data().fingerprint!==fingerprint)throw Error("Este cadastro já foi salvo com outros dados. Abra um novo cadastro.");
          return null;
        }
        const rows=await Promise.all(variants.map(async ({existing,...variant})=>{
          const ref=db.collection("products").doc(variant.id),snap=await tx.get(ref);
          if(!snap.exists&&existing)throw Error("Um produto foi removido em outra sessão. Reabra o cadastro.");
          const live=snap.exists?snap.data():null;
          if(live&&norm(live.name)!==norm(variant.name))throw Error("Um produto mudou em outra sessão. Reabra o cadastro.");
          const value=live?{...live,id:variant.id,stock:Number(live.stock||0)+variant.stock,
            ...(!live.brand?{brand:variant.brand,model:variant.model,flavor:variant.flavor}:{}),
            ...(!live.img&&img?{img}:{})}:variant;
          return {ref,value:productWithStock(live,value),existing:!!live};
        }));
        for(const row of rows)tx.set(row.ref,row.value);
        tx.set(marker,{id:operation,type:"stock-form-operation",fingerprint});
        return rows.filter(row=>row.existing).length;
      });
      closeM();render();
      if(already)alert((variants.length-already)+" pod(s) criado(s). "+already+" já existiam: só somei o estoque (custo e preço ficaram como estavam).");
      return;
    }
    const before=id?productFormSnapshot:null;
    if(id&&before?.id!==id)throw Error("Reabra o produto para editar.");
    const key=id||operation;
    const after={...before,id:key,name:$("pn").value.trim(),cost,price,stock:+$("ps").value||0,img:tmpImg,
      brand:b?.name||"",model:m?.n||"",flavor:b?pCur||"":""};
    if(!after.name)throw Error("Dê um nome ao pod");
    await commitProductChanges([{id:key,before,after}]);
    closeM();render();
  });
}
function cloudSave(seed=false){
  if(!db||!cloudOn)return;
  syncLegacyProducts(seed);
  ["sales","catalog","cphotos","expenses","closings","config","proofs"].forEach(c=>{
    const cur={};(S[c]||[]).forEach(x=>cur[x.id]=JSON.stringify(x));
    Object.keys(cur).forEach(id=>{if(c==='sales'&&window.kmNexus?.managed(JSON.parse(cur[id])))return;if(last[c][id]!==cur[id]){last[c][id]=cur[id];db.collection(c).doc(id).set(JSON.parse(cur[id])).catch(e=>console.error(e))}});
    Object.keys(last[c]).forEach(id=>{if(!(id in cur)){if(c==='sales'&&window.kmNexus?.managed(JSON.parse(last[c][id])))return;delete last[c][id];db.collection(c).doc(id).delete().catch(e=>console.error(e))}});
  });
}
function listen(){
  unsubs.forEach(f=>f());
  unsubs=["products","sales","catalog","cphotos","expenses","closings","config","proofs"].map(c=>db.collection(c).onSnapshot(sn=>{
    const a=[];last[c]={};
    sn.forEach(d=>{const x=d.data();x.id=d.id;a.push(x);last[c][d.id]=JSON.stringify(x)});
    S[c]=a;if(!sn.metadata.fromCache)ready[c]=1;if(c==="catalog"&&!a.length&&!sn.metadata.fromCache){S.catalog=seedCat();cloudSave()}if(!sn.metadata.fromCache&&migAll())cloudSave();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    if(!$("modal").innerHTML&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))render();
  },e=>console.error(e)));
}
// At most one authentication request at a time. This UI pause is not a server unblock.
let authLoginBusy=false,authLoginMode=0,authLoginTimer=null;
const AUTH_LOGIN_PAUSE_KEY='km_auth_login_pause_v1';
let authLoginBlockedUntil=0;
try{const saved=Number(sessionStorage.getItem(AUTH_LOGIN_PAUSE_KEY));if(Number.isFinite(saved)&&saved>Date.now())authLoginBlockedUntil=Math.min(saved,Date.now()+60000);}catch(e){}
function authLoginMessage(message,code=''){
 const target=$('lm');if(target)target.textContent=message+(code?' Código: '+code:'');
}
function authResetLoginPause(){
 authLoginBlockedUntil=0;if(authLoginTimer!==null){clearTimeout(authLoginTimer);authLoginTimer=null;}
 try{sessionStorage.removeItem(AUTH_LOGIN_PAUSE_KEY);}catch(e){}
}
function authPaintLogin(){
 if(authLoginTimer!==null){clearTimeout(authLoginTimer);authLoginTimer=null;}
 const submit=$('loginSubmit'),create=$('loginCreate'),form=$('kmLoginForm');if(!submit||!create||!form)return;
 const remaining=Math.max(0,Math.ceil((authLoginBlockedUntil-Date.now())/1000));
 submit.disabled=create.disabled=authLoginBusy||remaining>0;
 form.setAttribute('aria-busy',String(authLoginBusy));
 submit.textContent=remaining>0?'Aguarde '+remaining+'s':authLoginBusy&&authLoginMode===0?'Entrando…':'Entrar';
 create.textContent=authLoginBusy&&authLoginMode===1?'Criando conta…':'Criar conta';
 if(remaining>0)authLoginTimer=setTimeout(authPaintLogin,1000);
 else if(authLoginBlockedUntil)authResetLoginPause();
}
function loginUI(){
 $('login').innerHTML=`<div class="modal" style="align-items:center"><div class="sheet" style="border-radius:18px;max-width:380px"><h1>Seu negócio, bem cuidado.</h1>
 <form id="kmLoginForm" onsubmit="event.preventDefault();doLogin(0)">
 <label for="le">E-mail</label><input id="le" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
 <label for="lp">Senha (mín. 6 caracteres)</label><input id="lp" name="password" type="password" autocomplete="current-password" minlength="6" required>
 <div id="lm" class="bad sub" role="status" aria-live="polite" style="margin:8px 0"></div><div class="row"><button id="loginSubmit" type="submit">Entrar</button><button id="loginCreate" type="button" class="g" onclick="doLogin(1)">Criar conta</button></div></form></div></div>`;
 if(authLoginBlockedUntil>Date.now())authLoginMessage('O Firebase limitou temporariamente as tentativas. Aguarde antes de tentar novamente. A limitação do serviço pode durar mais que a pausa desta tela.','auth/too-many-requests');
 authPaintLogin();
}
async function doLogin(n){
 if(authLoginBusy||authLoginBlockedUntil>Date.now()){authPaintLogin();return;}
 const form=$('kmLoginForm'),email=$('le'),password=$('lp');if(!form||!email||!password)return;
 email.value=email.value.trim();if(!form.reportValidity())return;
 if(!au){authLoginMessage('O serviço de acesso ainda não está disponível. Confira a conexão e atualize a página.');return;}
 authLoginBusy=true;authLoginMode=n===1?1:0;authLoginMessage(authLoginMode===1?'Criando sua conta…':'Conferindo seu acesso…');authPaintLogin();
 try{
  if(authLoginMode===1)await au.createUserWithEmailAndPassword(email.value,password.value);
  else await au.signInWithEmailAndPassword(email.value,password.value);
  authResetLoginPause();authLoginMessage('Acesso autorizado. Carregando sua central…');
 }catch(error){
  const code=String(error?.code||'auth/unknown');
  const messages={
   'auth/too-many-requests':'O Firebase limitou temporariamente novas tentativas por excesso de pedidos ou atividade incomum. Aguarde e evite tentar repetidamente. A limitação do serviço pode durar mais que a pausa desta tela.',
   'auth/invalid-credential':'Não foi possível entrar com esses dados. Confira o e-mail e a senha antes de tentar novamente.',
   'auth/wrong-password':'Não foi possível entrar com esses dados. Confira o e-mail e a senha antes de tentar novamente.',
   'auth/user-not-found':'Não foi possível entrar com esses dados. Confira o e-mail e a senha antes de tentar novamente.',
   'auth/invalid-email':'Confira o formato do e-mail informado.',
   'auth/email-already-in-use':'Esse e-mail já possui uma conta. Use Entrar com a senha dessa conta.',
   'auth/weak-password':'Escolha uma senha com pelo menos 6 caracteres.',
   'auth/network-request-failed':'A conexão não permitiu concluir o acesso. Confira a internet antes de tentar novamente.',
   'auth/user-disabled':'Esta conta está desativada. Fale com o responsável pelo acesso.'
  };
  if(code==='auth/too-many-requests'){
   authLoginBlockedUntil=Date.now()+60000;
   try{sessionStorage.setItem(AUTH_LOGIN_PAUSE_KEY,String(authLoginBlockedUntil));}catch(e){}
  }
  authLoginMessage(messages[code]||'Não foi possível concluir o acesso. Confira os dados e a conexão antes de tentar novamente.',code);
 }finally{authLoginBusy=false;authPaintLogin();}
}

function initCloud(){
  if(FB.apiKey.startsWith("COLE")||!window.firebase)return;
  firebase.initializeApp(FB);au=firebase.auth();db=firebase.firestore();
  try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  au.onAuthStateChanged(u=>{
    if(u){
      authResetLoginPause();ready.products=false;cloudOn=true;$("login").innerHTML="";
      try{if(!localStorage.getItem(KEY+"_m")){cloudSave(true);localStorage.setItem(KEY+"_m","1")}}catch(e){}
      listen();render();
    }else{cloudOn=false;unsubs.forEach(f=>f());unsubs=[];loginUI()}
  });
}
if(FB.apiKey.startsWith("COLE")||!window.firebase){if(!CATS().length)S.catalog=seedCat();migAll();save()}
render();initCloud();
